// SDK configuration for XR2 AR glasses (API level 34)
android {
    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 34
    }

    compileSdkVersion 34
}

repositories {
    mavenCentral()
}

dependencies {
    // Khronos OpenXR Loader AAR — provides libopenxr_loader.so for Android
    // and auto-merges <queries> for runtime broker discovery (needed for Monado)
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
