// SDK configuration for XR2 AR glasses (API level 34)
android {
    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 34
    }

    compileSdkVersion 34
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.57'
}

