[/Script/EngineSettings.GeneralProjectSettings]
; Force start in VR/XR mode on Android
bStartInVR=True
bSupportVR=True

[ConsoleVariables]
; Ensure XR is enabled on Android startup (like Godot's UseXR = true)
xr.EnableStereo=1
r.VSync=0
; Enable verbose XR/OpenXR logging on Android
LogOpenXR=VeryVerbose
LogHMD=VeryVerbose
LogXR=VeryVerbose

[/Script/Engine.Engine]
; Use OpenXR on Android
XRSystem=OpenXR
